# FWC 빌드: 깃허브의 윈도우 서버에서 (1) 지오드 모드 .geode (2) 분석 앱 (3) 설치 exe 를 만든다.
# 결과는 Actions 실행 화면의 Artifacts 에 올라간다. 직접 돌리려면 Actions → FWC build → Run workflow.
name: FWC build
on:
  push:
  workflow_dispatch:

jobs:
  mod:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          path: fwc_geode
          sdk: given          # mod.json 의 geode 5.11.2 를 그대로 씀 (PC 빌드와 같은 버전)
          target: Win64
      - uses: actions/upload-artifact@v4
        with:
          name: fwc-mod
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error

  app-and-setup:
    needs: mod
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: 모듈 설치
        run: python -m pip install PySide6 numpy pillow msgpack imageio-ffmpeg pyinstaller
      - name: 분석 앱 빌드 (fwc_app/build.bat 과 같은 인자)
        working-directory: fwc_app
        run: >
          python -m PyInstaller --noconfirm --windowed --name GD_FWC --workpath build_ci --distpath dist_ci
          --paths engine --hidden-import gdplay --hidden-import partrun --hidden-import trigmove --hidden-import gdwave2
          --hidden-import wave_sim --hidden-import showcase_patch --hidden-import export_lib
          --add-data "engine;engine" --add-data "fonts;fonts" --add-data "bin;bin"
          --collect-binaries imageio_ffmpeg --exclude-module scipy gui.py
      - uses: actions/download-artifact@v4
        with:
          name: fwc-mod
          path: modout
      - name: 설치 exe 묶기 (fwc_installer/build_setup.bat 과 같은 방식)
        working-directory: fwc_installer
        run: |
          New-Item -ItemType Directory -Force payload | Out-Null
          Copy-Item ..\modout\fwc.window-counter.geode payload\ -Force
          python -c "import zipfile, os; src=r'..\fwc_app\dist_ci\GD_FWC'; z=zipfile.ZipFile(r'payload\GD_FWC.zip','w',zipfile.ZIP_DEFLATED,compresslevel=6); [z.write(os.path.join(d,f), os.path.relpath(os.path.join(d,f),src)) for d,_,fs in os.walk(src) for f in fs]; z.close()"
          python -m PyInstaller --noconfirm --onefile --windowed --name GD_FWC_Setup --workpath build_setup --distpath dist_setup --add-data "payload;payload" fwc_setup.py
      - name: 설치 시험 (창 없이, 임시 폴더에)
        working-directory: fwc_installer
        run: |
          $d = Join-Path $env:RUNNER_TEMP "inst"; $m = Join-Path $env:RUNNER_TEMP "mods"
          New-Item -ItemType Directory -Force $m | Out-Null
          $s = Join-Path $env:RUNNER_TEMP "settings"; New-Item -ItemType Directory -Force $s | Out-Null
          Set-Content -Path (Join-Path $s "settings.json") -Value '{"show-rings": false, "macro-play": false}' -Encoding utf8
          $mac = (Resolve-Path ..\fwc_app\tests\sac_route.gdr2).Path
          Start-Process dist_setup\GD_FWC_Setup.exe -ArgumentList "--quiet","--dir",$d,"--no-shortcut","--mods-dir",$m,"--macro",$mac,"--settings-dir",$s -Wait
          Get-Content dist_setup\fwc_setup_log.txt -ErrorAction SilentlyContinue
          if (-not (Test-Path (Join-Path $d "GD_FWC.exe"))) { throw "앱이 안 풀림" }
          if (-not (Test-Path (Join-Path $m "fwc.window-counter.geode"))) { throw "모드가 안 들어감" }
          $cm = Join-Path (Split-Path $m -Parent) "config\fwc.window-counter\macro.gdr2"
          if ((Get-FileHash $cm).Hash -ne (Get-FileHash $mac).Hash) { throw "매크로가 안 들어감" }
          $js = Get-Content (Join-Path $s "settings.json") -Raw | ConvertFrom-Json
          if ($js."macro-play" -ne $true -or $js."show-rings" -ne $false) { throw "설정이 잘못 바뀜" }
          "설치 시험 통과 (앱, 모드, 매크로, 설정)"
      - uses: actions/upload-artifact@v4
        with:
          name: GD_FWC_Setup
          path: fwc_installer/dist_setup/GD_FWC_Setup.exe
      - name: 가벼운 설치 exe (앱 없이 모드 + 매크로 고르기만, 디스코드 20 MB 이하용)
        working-directory: fwc_installer
        run: |
          New-Item -ItemType Directory -Force payload_lite | Out-Null
          Copy-Item ..\modout\fwc.window-counter.geode payload_lite\ -Force
          python -m PyInstaller --noconfirm --onefile --windowed --name GD_FWC_Mod_Setup --workpath build_lite --distpath dist_lite --add-data "payload_lite;payload" fwc_setup.py
          $sz = (Get-Item dist_lite\GD_FWC_Mod_Setup.exe).Length
          "크기: {0:N1} MB" -f ($sz / 1MB)
          if ($sz -ge 20MB) { throw "20 MB 넘음" }
          $m = Join-Path $env:RUNNER_TEMP "mods_lite"; $s = Join-Path $env:RUNNER_TEMP "settings_lite"
          New-Item -ItemType Directory -Force $m | Out-Null
          $mac = (Resolve-Path ..\fwc_app\tests\sac_route.gdr2).Path
          Start-Process dist_lite\GD_FWC_Mod_Setup.exe -ArgumentList "--quiet","--mods-dir",$m,"--macro",$mac,"--settings-dir",$s -Wait
          Get-Content dist_lite\fwc_setup_log.txt -ErrorAction SilentlyContinue
          if (-not (Test-Path (Join-Path $m "fwc.window-counter.geode"))) { throw "모드가 안 들어감" }
          $cm = Join-Path (Split-Path $m -Parent) "config\fwc.window-counter\macro.gdr2"
          if ((Get-FileHash $cm).Hash -ne (Get-FileHash $mac).Hash) { throw "매크로가 안 들어감" }
          $js = Get-Content (Join-Path $s "settings.json") -Raw | ConvertFrom-Json
          if ($js."macro-play" -ne $true) { throw "설정이 안 바뀜" }
          "가벼운 설치 시험 통과"
      - uses: actions/upload-artifact@v4
        with:
          name: GD_FWC_Mod_Setup
          path: fwc_installer/dist_lite/GD_FWC_Mod_Setup.exe
